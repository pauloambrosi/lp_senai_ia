name: Deploy no GitHub Pages

on:
  push:
    branches: ["claude/festive-franklin-sml18l"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite um deploy por vez, sem cancelar um que já esteja publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O site fica em https://<usuario>.github.io/<repositorio>/, então o
      # build precisa saber esse prefixo para gerar os caminhos dos assets.
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
