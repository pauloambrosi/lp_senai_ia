name: Deploy no GitHub Pages

on:
  push:
    branches: ["claude/festive-franklin-sml18l"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite um deploy por vez, sem cancelar um que já esteja publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O build usa caminhos relativos, então funciona em qualquer
      # subdiretório sem precisar saber o prefixo do Pages.
      - name: Build
        run: npm run build

      # enablement: true faz a action trocar a origem do Pages para "GitHub
      # Actions" via API. Sem isso, um repositório configurado para servir a
      # branch continua publicando o código-fonte, e o deploy do Actions é
      # criado mas nunca vai ao ar.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
